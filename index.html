<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planetary Defense</title>
    <meta
      name="description"
      content="Planetary Defense: defend the planet from incoming meteors, and let the friendly escape pods through."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./" class="sr-only">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="sr-only">Planetary Defense</h1>
      <canvas id="game"></canvas>

      <button
        type="button"
        id="mute-toggle"
        class="mute-toggle"
        aria-pressed="false"
        aria-label="Mute background music"
      >
        🔊
      </button>

      <div class="hud" aria-hidden="true">
        <div class="hud-stat">
          <span class="hud-label">Score</span>
          <span class="hud-value" id="hud-score">0</span>
        </div>
        <span class="hud-divider"></span>
        <div class="hud-stat">
          <span class="hud-label">Hits</span>
          <span class="hud-value" id="hud-hits">0 / 3</span>
        </div>
      </div>

      <div class="game-over" id="game-over" aria-hidden="true">
        <div class="game-over__card">
          <p class="game-over__title" id="game-over-title">Game Over</p>
          <p class="game-over__score" id="game-over-score">Score: 0</p>
          <p class="game-over__hint">Click to play again</p>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
